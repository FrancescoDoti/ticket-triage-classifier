[project]
name = "triage"
version = "0.1.0"
description = "Support-ticket intent triage on Banking77: TF-IDF vs embeddings vs fine-tuned transformer, with temperature calibration and a confidence threshold that routes uncertain tickets to a human."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "joblib>=1.3"]

[project.optional-dependencies]
neural = ["torch>=2.2", "transformers>=4.40", "sentence-transformers>=3.0", "matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]
